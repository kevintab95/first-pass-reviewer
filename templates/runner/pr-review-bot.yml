# yaml-language-server: $schema=https://raw.githubusercontent.com/kevintab95/first-pass-reviewer/v1/schemas/config.schema.json
# Configuration for first-pass-reviewer. Every key is documented in docs/configuration.md
# of the first-pass-reviewer repo; only `reviewer` and `repos` are required.

# Your GitHub login: PRs waiting on you are reviewed, and draft reviews are created as you.
reviewer: your-github-login

# Repositories to watch.
repos:
  - your-org/your-repo

select:
  assigned: true # PRs assigned to you
  reviewRequested: true # PRs where you are a requested reviewer
  skipDraftPrs: true
  skipAuthors: ["dependabot[bot]"]

agent:
  type: claude-code
  # model: claude-opus-5-5
  maxTurns: 40
  timeoutMinutes: 20

prompt:
  # Project-specific review focus, in addition to the repo's own AGENTS.md.
  extraGuidance:
    - guidance/example.md

limits:
  maxPrsPerRun: 5
  maxComments: 15
